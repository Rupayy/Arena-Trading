<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d18"><title>Arena98 • Member Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c16;--gold:#e8bd70;--gold2:#f5d99d;--white:#f5f7fb;--muted:#91a0b8;--green:#48d6a0;--red:#ff7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px 15px 35px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#263b5c 0,transparent 48%),var(--bg);color:var(--white);font-family:'DM Sans',sans-serif}.wrap{width:100%;max-width:440px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.brand{display:flex;align-items:center;gap:10px;font:800 18px Manrope}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#f7dfa9,#b9843d);color:#17120a;display:grid;place-items:center;font-weight:900}.pill{font-size:10px;color:#aab8cb;border:1px solid #344157;padding:8px 10px;border-radius:30px}.card{position:relative;overflow:hidden;padding:27px 22px 23px;border:1px solid #2b3a51;border-radius:25px;background:linear-gradient(155deg,#172236,#101725 72%);box-shadow:0 24px 70px #0007}.card:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#d5a65b0c;right:-90px;top:-110px;pointer-events:none}.badge{color:var(--gold);font-size:10px;letter-spacing:2.5px;font-weight:700;text-align:center}.title{text-align:center;font:800 29px Manrope;letter-spacing:-1px;margin:10px 0 7px}.sub{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 25px}.field{margin:16px 0}.field label{display:block;font-size:12px;color:#c5cede;margin:0 0 8px;font-weight:600}.input{width:100%;border:1px solid #344158;background:#0c1422;color:white;border-radius:13px;padding:15px 13px;outline:none;transition:.2s}.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e8bd7018}.input::placeholder{color:#68778e}.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:800;cursor:pointer;transition:transform .2s,filter .2s;font-size:13px}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(110deg,#f4d99e,#d5a052);color:#1b160d;box-shadow:0 9px 25px #d5a05225;margin-top:7px}.secondary{background:#202c40;color:#e8edf6;border:1px solid #34435b;margin-top:11px}.error{font-size:11px;color:var(--red);min-height:17px;margin:10px 2px 0;text-align:center}.remember{display:flex;align-items:center;gap:9px;color:#aab8cb;font-size:11px;margin:14px 2px}.remember input{accent-color:#d8ad66;width:15px;height:15px}.foot{text-align:center;color:#64738a;font-size:10px;line-height:1.7;margin:20px 0}.foot a{color:#c6d0df;text-decoration:none}.security{text-align:center;color:#8b9bb1;font-size:10px;margin-top:18px}.security span{color:var(--green)}.fade{animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(min-width:600px){.card{padding:32px}.top{margin-bottom:32px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap fade">
<header class="top"><div class="brand"><div class="logo">A</div>ARENA<span style="color:var(--gold)">98</span></div><div class="pill">MEMBERs</div></header>
<section class="card"><div class="badge">WELCOME BACK</div><h1 class="title">Members login</h1><p class="sub">Enter your Arena access details to continue to login.</p>
<form id="loginForm" autocomplete="on"><div class="field"><label for="user">User ID</label><input class="input" id="user" name="username" placeholder="Enter your user ID" autocomplete="username" required></div><div class="field"><label for="package">Package ID</label><input class="input" id="package" name="package" placeholder="Enter your package ID" autocomplete="off" required></div>
<label class="remember"><input type="checkbox" id="remember" checked> Remember my Access on this device</label>
<button class="btn primary" type="submit">Login securely&nbsp; →</button><div class="error" id="error" aria-live="polite"></div></form>
<button class="btn secondary" id="buy">Explore / Buy Package</button><div class="security"><span>●</span> Protected member access</div></section>
<footer class="foot">Need access details? Complete your payment or contact your agent.<br><a href="payment.html">Go to payment page</a><br><br>© 2026 Arena</footer>
</main><script>
const user=document.getElementById('user'),pkg=document.getElementById('package'),error=document.getElementById('error'),remember=document.getElementById('remember');
const params=new URLSearchParams(location.search);
user.value=params.get('user')||localStorage.getItem('arena98_user')||'';
pkg.value=params.get('package')||localStorage.getItem('arena98_package')||'';
if(user.value&&pkg.value)remember.checked=true;
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=user.value.trim(),p=pkg.value.trim();if(u==='Arena98TS'&&p==='PCK37NM'){if(remember.checked){localStorage.setItem('arena98_user',u);localStorage.setItem('arena98_package',p);}else{localStorage.removeItem('arena98_user');localStorage.removeItem('arena98_package');}sessionStorage.setItem('arena98_logged_in','true');error.style.color='var(--green)';error.textContent='Login successful…';setTimeout(()=>location.href='dashboard.html',500);}else{error.style.color='var(--red)';error.textContent='Invalid User ID or Package ID. Please check your details.';}});
document.getElementById('buy').onclick=()=>location.href='arena.html';
</script></body></html>
