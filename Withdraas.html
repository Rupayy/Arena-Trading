<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Withdraw Funds | Premium Finance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#07111f; --panel:#0d1b2d; --panel2:#102239; --line:rgba(164,190,220,.15);
  --tx:#f4f8ff; --mut:#91a4bb; --green:#42e6a4; --green2:#19bd86;
  --gold:#e9c987; --err:#ff7183; --field:#0a1727;
  --shadow:0 28px 70px rgba(0,0,0,.34);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;scroll-behavior:smooth}
body{
  color:var(--tx);font-family:"DM Sans",-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 12% 0%,rgba(34,110,116,.22),transparent 36%),
             radial-gradient(ellipse at 100% 85%,rgba(34,75,139,.20),transparent 38%),var(--bg);
  overflow-x:hidden;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(95px);opacity:.2;will-change:transform}
.o1{width:430px;height:430px;background:#1b9d83;top:-220px;left:-170px;animation:f1 20s ease-in-out infinite}
.o2{width:420px;height:420px;background:#285ca8;bottom:-230px;right:-170px;animation:f2 24s ease-in-out infinite}
.o3{width:250px;height:250px;background:#d2a65c;top:45%;left:65%;opacity:.08;animation:f3 26s ease-in-out infinite}
@keyframes f1{50%{transform:translate(100px,80px) scale(1.12)}}
@keyframes f2{50%{transform:translate(-90px,-70px) scale(1.14)}}
@keyframes f3{50%{transform:translate(-120px,50px) scale(.85)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(150,180,210,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(150,180,210,.045) 1px,transparent 1px);background-size:52px 52px;opacity:.34;mask-image:radial-gradient(ellipse at 50% 30%,#000 5%,transparent 72%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 5%,transparent 72%)}
.dust{display:none}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:24px 17px 48px}
.top{display:flex;align-items:center;justify-content:space-between;animation:in .7s both;padding:2px 1px 12px}
.icon-btn{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:rgba(17,35,55,.76);color:var(--tx);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(16px);transition:.25s;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.icon-btn:hover{border-color:rgba(66,230,164,.55);background:#142b40;transform:translateY(-2px)}
.icon-btn:active{transform:scale(.94)}
.top h1{font-family:Manrope,sans-serif;font-size:17px;font-weight:800;letter-spacing:.1px;margin:0}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal{opacity:0;animation:in .75s cubic-bezier(.2,.8,.2,1) forwards}
.hero{
  margin:20px 0 16px;padding:26px 23px 23px;border-radius:27px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#123d42 0%,#102c3b 48%,#172b43 100%);
  border:1px solid rgba(139,224,199,.2);box-shadow:0 22px 55px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.09);
  animation-delay:.1s
}
.hero::before{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(255,255,255,.07);border-radius:50%;right:-90px;top:-130px;box-shadow:0 0 0 25px rgba(255,255,255,.025),0 0 0 55px rgba(255,255,255,.018)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.07) 48%,transparent 65%);transform:translateX(-110%);animation:shine 7s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,65%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
.hero small{position:relative;z-index:1;color:#b6d1d2;font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase}
.big{position:relative;z-index:1;font-family:Manrope,sans-serif;font-size:42px;font-weight:800;margin:8px 0 22px;letter-spacing:-1.8px;color:#fff}
.big span{font-family:"DM Sans",sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;margin-right:7px;color:#a8e9d0;vertical-align:6px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#20c994,#8af0c6);box-shadow:0 0 16px rgba(66,230,164,.5);transition:width .7s cubic-bezier(.2,.9,.3,1)}
.bar-txt{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;margin-top:11px;font-size:12px;color:#b1c7d1}
.bar-txt b{color:#8af0c6;font-weight:700}
.card{padding:25px 21px 21px;border-radius:27px;background:linear-gradient(155deg,rgba(17,35,56,.97),rgba(10,24,41,.97));border:1px solid rgba(164,190,220,.15);backdrop-filter:blur(22px);box-shadow:var(--shadow);animation-delay:.2s}
.fld{position:relative;margin-bottom:18px}
.fld>label{display:block;font-size:11px;color:#a9bbcf;font-weight:700;letter-spacing:1.15px;text-transform:uppercase;margin:0 0 9px 3px}
.inp{width:100%;padding:16px 16px;border-radius:14px;border:1px solid rgba(164,190,220,.18);background:linear-gradient(180deg,rgba(4,15,28,.75),rgba(9,23,39,.85));color:var(--tx);font:inherit;font-size:15px;outline:none;transition:.25s;appearance:none;-webkit-appearance:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.inp::placeholder{color:#637991}
.inp:focus{border-color:rgba(66,230,164,.75);background:#0b2030;box-shadow:0 0 0 3px rgba(66,230,164,.09),0 8px 22px rgba(0,0,0,.12)}
.fld.bad .inp,.fld.bad .dd-btn{border-color:var(--err);animation:shake .4s}
.err{color:var(--err);font-size:12px;margin:7px 0 0 4px;display:none}
.fld.bad .err{display:block}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.dd{position:relative}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-radius:14px;border:1px solid rgba(164,190,220,.18);background:linear-gradient(180deg,rgba(4,15,28,.75),rgba(9,23,39,.85));color:#8195aa;font:inherit;font-size:15px;cursor:pointer;transition:.25s;text-align:left}
.dd-btn.has{color:var(--tx)}
.dd.open .dd-btn{border-color:rgba(66,230,164,.75);box-shadow:0 0 0 3px rgba(66,230,164,.09)}
.dd-btn svg{transition:.3s;flex:none}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:5;max-height:0;overflow:hidden;opacity:0;background:#102239;border:1px solid var(--line);border-radius:16px;transition:max-height .35s cubic-bezier(.2,.8,.2,1),opacity .25s;box-shadow:0 22px 45px rgba(0,0,0,.5)}
.dd.open .dd-list{max-height:260px;opacity:1;overflow-y:auto}
.dd-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;font-size:14px;transition:.2s;border-bottom:1px solid rgba(255,255,255,.055)}
.dd-item:last-child{border:0}
.dd-item:hover{background:rgba(66,230,164,.09);padding-left:20px}
.dd-av{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#06251c;background:linear-gradient(135deg,#83f1c7,#26c995);flex:none}
.dd-item.w .dd-av{background:linear-gradient(135deg,#f2d99d,#c59b55);color:#2a210f}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.chip{border:1px solid rgba(164,190,220,.17);background:rgba(5,17,30,.65);color:#dce8f5;border-radius:11px;padding:11px 0;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.25s}
.chip:hover{border-color:rgba(66,230,164,.6);transform:translateY(-2px);background:rgba(66,230,164,.07)}
.chip.on{background:linear-gradient(135deg,#75edbd,#2cc995);color:#06251c;font-weight:800;border-color:transparent;box-shadow:0 7px 18px rgba(36,201,145,.2)}
.hint{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:#91a7bc;line-height:1.45}
.hint svg{color:var(--gold);flex:none}
.btn{position:relative;overflow:hidden;width:100%;margin-top:9px;border:0;border-radius:14px;padding:17px;font:inherit;font-size:15px;font-weight:800;letter-spacing:.15px;color:#05271e;cursor:pointer;background:linear-gradient(105deg,#29c993,#8af0c6,#43d9a7);background-size:220% 100%;animation:flow 5s linear infinite;box-shadow:0 12px 28px rgba(32,197,143,.22);transition:transform .15s,box-shadow .3s}
.btn:hover{box-shadow:0 16px 34px rgba(32,197,143,.32);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.load{pointer-events:none}
.btn.load .t{opacity:0}
.btn .sp{position:absolute;inset:0;display:none;place-items:center}
.btn.load .sp{display:grid}
@keyframes flow{to{background-position:-220% 0}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:11px;color:#8196ac;letter-spacing:.15px}
.secure svg{color:#66dcb0}
.ov{position:fixed;inset:0;z-index:20;background:rgba(1,8,16,.72);backdrop-filter:blur(9px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;background:linear-gradient(180deg,#142941,#0b192a);border:1px solid rgba(164,190,220,.18);border-bottom:0;border-radius:28px 28px 0 0;padding:14px 24px calc(28px + env(safe-area-inset-bottom,0));text-align:center;transform:translateY(100%);transition:transform .48s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 70px rgba(0,0,0,.3)}
.ov.show .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 22px}
.badge{width:82px;height:82px;border-radius:25px;margin:0 auto 18px;display:grid;place-items:center;position:relative}
.badge.e{background:rgba(255,113,131,.12);color:var(--err)}
.badge.ok{background:rgba(66,230,164,.12);color:var(--green)}
.badge::before{content:"";position:absolute;inset:-7px;border-radius:29px;border:1px solid currentColor;opacity:0;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.draw{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .7s .25s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.sheet h2{font-family:Manrope,sans-serif;margin:0 0 8px;font-size:22px;font-weight:800}
.sheet p{margin:0 0 20px;color:#a2b5c9;line-height:1.6;font-size:14px}
.sum{background:rgba(3,14,25,.55);border:1px solid var(--line);border-radius:16px;padding:8px 16px;text-align:left;margin-bottom:20px}
.sum div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.09)}
.sum div:last-child{border:0}
.sum span{color:#8fa4ba}.sum b{text-align:right;word-break:break-all}
.steps{display:flex;justify-content:space-between;position:relative;margin:4px 6px 22px}
.steps::before{content:"";position:absolute;top:13px;left:12%;right:12%;height:2px;background:rgba(255,255,255,.1)}
.st{position:relative;flex:1;font-size:11px;color:#8fa4ba}
.st i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 8px;background:#1b3046;border:2px solid rgba(255,255,255,.14);position:relative;z-index:1}
.st.d i{background:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(66,230,164,.5)}
.st.c i{border-color:var(--gold);animation:pulse2 1.4s infinite}
.st.d,.st.c{color:var(--tx)}
@keyframes pulse2{50%{box-shadow:0 0 0 7px rgba(233,201,135,.12)}}
.ghost{background:rgba(255,255,255,.06);color:var(--tx);box-shadow:none;animation:none;border:1px solid var(--line)}
.ghost:hover{box-shadow:none;border-color:rgba(66,230,164,.55)}
.badge.pr{background:rgba(233,201,135,.12);color:var(--gold)}
.dots i{font-style:normal;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.ind{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 0 20px;position:relative}
.ind i{position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
.confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:30;opacity:.9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(min-width:600px){.wrap{padding-top:34px}.hero{margin-top:24px}.card{padding:28px 24px 23px}}
@media(max-width:360px){.wrap{padding-left:13px;padding-right:13px}.card{padding:21px 16px}.big{font-size:37px}.chips{gap:6px}.chip{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="bg">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div>
  <div id="dust"></div>
</div>

<div class="wrap">
  <div class="top">
    <button class="icon-btn" aria-label="Back" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Withdraw Funds</h1>
    <button class="icon-btn" aria-label="Info" id="infoBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01" stroke-linecap="round"/></svg>
    </button>
  </div>

  <section class="hero reveal">
    <small>You are withdrawing</small>
    <div class="big"><span>NPR</span><b id="bigAmt">0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="bar-txt"><span id="barLeft">Minimum NPR 8,000</span><b id="barPct">0%</b></div>
  </section>

  <form class="card reveal" id="form" novalidate autocomplete="off">
    <div class="fld" id="f-bank">
      <label>Destination</label>
      <div class="dd" id="dd">
        <button type="button" class="dd-btn" id="ddBtn">
          <span id="ddTxt">Select wallet or bank</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dd-list" id="ddList"></div>
      </div>
      <div class="err">Please choose a destination</div>
    </div>

    <div class="fld" id="f-acc">
      <label for="acc">Account Number</label>
      <input id="acc" class="inp" inputmode="numeric" placeholder="Receiver account number">
      <div class="err">Enter a valid account number</div>
    </div>

    <div class="fld" id="f-name">
      <label for="name">Account Holder's Name</label>
      <input id="name" class="inp" placeholder="Receiver's account name" autocomplete="name">
      <div class="err">Enter the account holder's name</div>
    </div>

    <div class="fld" id="f-amt">
      <label for="amt">Amount (NPR)</label>
      <input id="amt" class="inp" inputmode="numeric" placeholder="Amount to withdraw">
      <div class="chips" id="chips">
        <button type="button" class="chip" data-v="8000">8,000</button>
        <button type="button" class="chip" data-v="10000">10,000</button>
        <button type="button" class="chip" data-v="15000">15,000</button>
        <button type="button" class="chip" data-v="25000">25,000</button>
      </div>
      <div class="hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01" stroke-linecap="round"/></svg>
        <span id="hint">Minimum withdrawal amount is NPR 8,000.</span>
      </div>
      <div class="err">Enter an amount</div>
    </div>

    <div class="fld">
      <label for="rem">Purpose / Remarks</label>
      <input id="rem" class="inp" placeholder="Write purpose / remarks (optional)">
    </div>

    <button type="submit" class="btn" id="go">
      <span class="t">Submit Withdrawal</span>
      <span class="sp"><svg class="spin" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#04140b" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg></span>
    </button>
    <div class="secure">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Encrypted &amp; protected connection
    </div>
  </form>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
(()=>{
const MIN = 8000;
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-IN');
const banks = [["eSewa","w"],["Khalti","w"],["Nabil Bank"],["Global IME Bank"],["NIC Asia Bank"],["Nepal Investment Mega Bank"],["Prabhu Bank"],["Sanima Bank"],["Siddhartha Bank"],["Himalayan Bank"]];
let bank = "";

/* floating dust particles */
for(let i=0;i<22;i++){
  const d=document.createElement('i');d.className='dust';
  d.style.left=Math.random()*100+'%';d.style.bottom='-10px';
  d.style.animationDuration=(8+Math.random()*10)+'s';
  d.style.animationDelay=(-Math.random()*14)+'s';
  d.style.transform='scale('+(.6+Math.random()*1.4)+')';
  $('dust').appendChild(d);
}

/* custom dropdown */
const list=$('ddList');
banks.forEach(([n,w])=>{
  const el=document.createElement('div');
  el.className='dd-item'+(w?' w':'');
  el.innerHTML='<div class="dd-av">'+n.trim().slice(0,2).toUpperCase()+'</div><span>'+n+'</span>';
  el.onclick=()=>{bank=n;$('ddTxt').textContent=n;$('ddBtn').classList.add('has');$('dd').classList.remove('open');$('f-bank').classList.remove('bad')};
  list.appendChild(el);
});
$('ddBtn').onclick=e=>{e.stopPropagation();$('dd').classList.toggle('open')};
document.addEventListener('click',e=>{if(!$('dd').contains(e.target))$('dd').classList.remove('open')});

/* amount counter + progress */
const amt=$('amt'); let shown=0, raf;
function animateTo(target){
  cancelAnimationFrame(raf);
  const from=shown, t0=performance.now(), dur=550;
  (function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    shown=Math.round(from+(target-from)*e);
    $('bigAmt').textContent=fmt(shown);
    if(p<1) raf=requestAnimationFrame(step);
  })(t0);
}
function sync(){
  const n=parseInt(amt.value||'0',10)||0;
  animateTo(n);
  const pct=Math.min(100,Math.round(n/MIN*100));
  $('barFill').style.width=pct+'%';
  $('barPct').textContent=n>=MIN?'Eligible ✓':pct+'%';
  $('barLeft').textContent=n>=MIN?'Ready to withdraw':'NPR '+fmt(Math.max(0,MIN-n))+' more needed';
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===String(n)));
}
amt.addEventListener('input',()=>{amt.value=amt.value.replace(/\D/g,'').slice(0,9);sync();$('f-amt').classList.remove('bad')});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{amt.value=c.dataset.v;sync();$('f-amt').classList.remove('bad')});
$('acc').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^\dA-Za-z]/g,'');$('f-acc').classList.remove('bad')});
$('name').addEventListener('input',()=>$('f-name').classList.remove('bad'));
$('infoBtn').onclick=()=>{const h=$('hint');h.textContent='Minimum withdrawal amount is NPR '+fmt(MIN)+'.';h.parentElement.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:400})};

/* button ripple */
$('go').addEventListener('pointerdown',e=>{
  const b=e.currentTarget,r=b.getBoundingClientRect(),s=document.createElement('span');
  s.className='rip';s.style.width=s.style.height='60px';
  s.style.left=(e.clientX-r.left-30)+'px';s.style.top=(e.clientY-r.top-30)+'px';
  b.appendChild(s);setTimeout(()=>s.remove(),600);
});

/* sheet */
function openSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('ov').classList.add('show')}
window.__closeSheet=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{if(e.target.id==='ov')window.__closeSheet()};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function confetti(){
  const cols=['#3dff7a','#14c46a','#f5d58a','#ffffff'];
  for(let i=0;i<46;i++){
    const c=document.createElement('i');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%4];
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=(Math.random()*.4)+'s';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
  }
}

async function submitWithdrawal(data){

/* submit */
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const acc=$('acc').value.trim(), name=$('name').value.trim(), n=parseInt(amt.value||'0',10)||0;
  const checks=[['f-bank',!!bank],['f-acc',acc.length>=6],['f-name',name.length>=2],['f-amt',n>0]];
  let ok=true;
  checks.forEach(([id,v])=>{const f=$(id);f.classList.remove('bad');void f.offsetWidth;if(!v){f.classList.add('bad');ok=false}});
  if(!ok){document.querySelector('.fld.bad').scrollIntoView({behavior:'smooth',block:'center'});return}

  if(n<MIN){
    openSheet(`<div class="badge e"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path class="draw" d="M15 9l-6 6M9 9l6 6"/></svg></div>
      <h2>Not Eligible</h2>
      <p>The minimum withdrawal is <b style="color:var(--tx)">NPR ${fmt(MIN)}</b>. Please increase your amount by <b style="color:var(--gold)">NPR ${fmt(MIN-n)}</b> to continue.</p>
      <button class="btn" onclick="__closeSheet()"><span class="t">Try Again</span></button>`);
    return;
  }

  const rem=$('rem').value.trim();
  openSheet(`<div class="badge pr"><svg class="spin" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg></div>
    <h2>Processing<span class="dots"><i>.</i><i>.</i><i>.</i></span></h2>
    <p>Your withdrawal request is being processed. Please keep this page open.</p>
    <div class="ind"><i></i></div>
    <div class="sum">
      <div><span>To</span><b>${esc(bank)}</b></div>
      <div><span>Account</span><b>${esc(acc)}</b></div>
      <div><span>Name</span><b>${esc(name)}</b></div>
      <div><span>Amount</span><b style="color:var(--g1)">NPR ${fmt(n)}</b></div>
      ${rem?`<div><span>Remarks</span><b>${esc(rem)}</b></div>`:''}
    </div>
    <button class="btn ghost" onclick="__closeSheet()"><span class="t">Close</span></button>`);
  $('go').classList.add('load');
  let res;
  try{res=await submitWithdrawal({bank,acc,name,amount:n,remarks:$('rem').value.trim()})}catch(_){res={ok:false}}
  $('go').classList.remove('load');

  if(!res.ok){
    openSheet(`<div class="badge e"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg></div>
      <h2>Request Failed</h2><p>We couldn't submit your request. Please try again.</p>
      <button class="btn" onclick="__closeSheet()"><span class="t">Close</span></button>`);
    return;
  }

  /* request accepted by the server: the Processing sheet stays on screen */
});

sync();
})();
</script>
